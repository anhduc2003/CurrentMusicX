name: Manual debug APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the debug build
        required: false
        default: "v1.3.5-youtube"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;35.0.0" "ndk;30.0.16248370" "cmake;4.1.2"
      - name: Build debug APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          cp "$apk" "CurrentMusic-${{ inputs.tag }}-debug.apk"
          sha256sum "CurrentMusic-${{ inputs.tag }}-debug.apk" > SHA256SUMS.txt
      - name: Publish debug build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: CurrentMusic ${{ inputs.tag }} (debug-signed)
          body: |
            Bản dựng debug từ nhánh main (đã sửa luồng đăng nhập Google/YouTube).

            APK ký bằng debug certificate, chỉ dùng để thử nghiệm. Không dùng để cập nhật đè lên bản phát hành chính thức.
          files: |
            CurrentMusic-${{ inputs.tag }}-debug.apk
            SHA256SUMS.txt
          prerelease: true
          make_latest: 'false'