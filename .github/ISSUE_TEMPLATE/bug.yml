name: Báo cáo sự cố
description: Sự cố phát nhạc, giao diện, đăng nhập hoặc các tính năng khác
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Vui lòng tìm kiếm các sự cố hiện có trước. Không tải lên mật khẩu tài khoản, Cookie, Token, toàn bộ danh sách phát riêng tư hoặc nhật ký chưa kiểm tra.
  - type: input
    id: version
    attributes:
       label: Phiên bản ứng dụng
       description: Số phiên bản trong Cài đặt → Giới thiệu; nếu tự biên dịch, vui lòng đính kèm mã commit.
    validations:
      required: true
  - type: input
    id: device
    attributes:
       label: Thiết bị và phiên bản Android
       placeholder: Mẫu điện thoại, phiên bản Android, phiên bản hệ thống
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
       label: Nguồn cài đặt
       options: [Bản chính thức GitHub, Bản thử nghiệm, Tự biên dịch, Khác]
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
       label: Mô-đun gặp sự cố
       options: [Phát nhạc và hiệu ứng âm thanh, Lời bài hát, Nguồn nhạc và mạng, Giao diện và hình thức, Tải xuống và bộ nhớ đệm, Khác]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
       label: Các bước tái hiện
       description: Bắt đầu từ trang nào, lần lượt nhấn vào đâu, sự cố có xảy ra mỗi lần không.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
       label: Kết quả thực tế và mong đợi
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
       label: Ảnh chụp màn hình và thông tin chẩn đoán
       description: Có thể đính kèm nhật ký đã ẩn thông tin nhạy cảm. Với sự cố âm thanh, vui lòng bổ sung nguồn nhạc, chế độ đầu ra, trạng thái hiệu ứng âm thanh và mẫu tai nghe/DAC.
