name: Đề xuất tính năng
description: Tính năng mới, tương tác hoặc cải tiến các khả năng hiện có
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Nhu cầu và tình huống sử dụng
      description: Bạn đang gặp vấn đề gì, muốn cải thiện điều gì? Vui lòng tìm kiếm các đề xuất hiện có trước.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Phương án đề xuất
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Phương án thay thế và thông tin bổ sung
